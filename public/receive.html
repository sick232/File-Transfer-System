<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Receive File</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <center>
    <p class="p1">Receive Your File</p>
    <br>
    <input type="text" id="codeInput" placeholder="Enter Code" required>
    <br><br>
    <button id="fetchBtn" class="b1"><span>Get File</span></button>
    <div id="result" class="p2"></div>
  </center>

  <script>
    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const code = document.getElementById('codeInput').value.trim();
      if (!code) return alert('Enter a code first!');
      const response = await fetch(`/receive/${code}`);
      const data = await response.json();
      const result = document.getElementById('result');

      if (response.ok) {
        result.innerHTML = `
          <p>📄 File Name: ${data.file_name}</p>
          <p>⏱ Uploaded At: ${data.upload_time}</p>
          <a href="/download/${code}" class="b1"><span>Download File</span></a>
        `;
      } else {
        result.innerHTML = `<p>❌ ${data.message}</p>`;
      }
    });
  </script>
</body>
</html>
